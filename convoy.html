<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LONG CONVOY — Актуальные рейсы</title>
  <!-- Подключаем внешний CSS файл -->
  <link rel="stylesheet" href="css/convoy.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header__titles">
        <h1>🚛 <span>LONG CONVOY</span> VTC QUPER</h1>
        <p>Актуальные конвойные рейсы</p>
      </div>
      <div class="header__liks">
        <a class="header__link" href="/">Главная</a>
        <a class="header__link" href="convoy.html">Конвои</a>
      </div>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">🚛 Все</button>
      <button class="filter-btn" data-filter="ATS">🇺🇸 ATS</button>
      <button class="filter-btn" data-filter="ETS2">🇪🇺 ETS2</button>
      <button class="filter-btn" data-filter="active">🔥 Активные</button>
      <button class="filter-btn" data-filter="upcoming">⏰ Запланированные</button>
      <button class="filter-btn" data-filter="ended">✅ Завершённые</button>
    </div>

    <div class="convoy-grid" id="convoyGrid">
      <div class="empty-state">
        <div class="loading-spinner"></div>
        <h3>Загрузка конвоев...</h3>
      </div>
    </div>

    <div class="footer">
      <p>🔗 VTC QUPER Simulator |
        <a href="https://discord.gg/KbjtTFgbbB" target="_blank" style="color: #f39c12;">Discord</a>
      </p>
    </div>
  </div>

  <!-- Подключаем внешний JavaScript файл -->
  <script src="js/convoy.js"></script>
</body>
</html>
