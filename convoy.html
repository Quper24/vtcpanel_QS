<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LONG CONVOY — Актуальные рейсы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            color: white;
            margin-bottom: 10px;
        }

        .header h1 span {
            color: #f39c12;
        }

        .header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: #f39c12;
            color: #1a1a2e;
        }

        .filter-btn:hover {
            background: rgba(243, 156, 18, 0.7);
            transform: translateY(-2px);
        }

        .convoy-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .convoy-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .convoy-card:hover {
            transform: translateY(-5px);
        }

        .card-header {
            padding: 20px;
            color: white;
        }

        .card-header.ATS {
            background: linear-gradient(135deg, #2c3e50, #1a1a2e);
        }

        .card-header.ETS2 {
            background: linear-gradient(135deg, #1e8449, #145a32);
        }

        .game-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .game-badge.ATS {
            background: #3498db;
        }

        .game-badge.ETS2 {
            background: #27ae60;
        }

        .card-header h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .time-range {
            font-size: 0.8rem;
            opacity: 0.9;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-left: 10px;
        }

        .status-active {
            background: #27ae60;
            color: white;
        }

        .status-upcoming {
            background: #f39c12;
            color: #1a1a2e;
        }

        .status-ended {
            background: #95a5a6;
            color: white;
        }

        .card-body {
            padding: 20px;
        }

        .route {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .route-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .route-icon {
            width: 30px;
            font-size: 1.2rem;
        }

        .route-text {
            flex: 1;
            font-size: 0.9rem;
        }

        .cargo {
            background: #e8f8f5;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .cargo-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .cargo-label {
            font-weight: bold;
            color: #2c3e50;
        }

        .creation-links {
            background: #2c3e50;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .creation-links h4 {
            color: #f39c12;
            font-size: 0.8rem;
            margin-bottom: 10px;
        }

        .link-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .link-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 8px;
            border: none;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .link-btn.trucky {
            background: #e67e22;
            color: white;
        }

        .link-btn.cargoman {
            background: #2980b9;
            color: white;
        }

        .link-btn:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }

        .card-footer {
            padding: 15px 20px;
            background: #f8f9fa;
            border-top: 1px solid #ecf0f1;
        }

        .join-btn {
            width: 100%;
            text-align: center;
            background: #f39c12;
            color: #2c3e50;
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.85rem;
        }

        .join-btn:hover {
            background: #e67e22;
            transform: scale(1.02);
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            color: #7f8c8d;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #f39c12;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            .convoy-grid {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚛 <span>LONG CONVOY</span> VTC QUPER</h1>
            <p>Актуальные конвойные рейсы</p>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">🚛 Все</button>
            <button class="filter-btn" data-filter="ATS">🇺🇸 ATS</button>
            <button class="filter-btn" data-filter="ETS2">🇪🇺 ETS2</button>
            <button class="filter-btn" data-filter="active">🔥 Активные</button>
            <button class="filter-btn" data-filter="upcoming">⏰ Запланированные</button>
            <button class="filter-btn" data-filter="ended">✅ Завершённые</button>
        </div>

        <div class="convoy-grid" id="convoyGrid">
            <div class="empty-state">
                <div class="loading-spinner"></div>
                <h3>Загрузка конвоев...</h3>
            </div>
        </div>

        <div class="footer">
            <p>🔗 VTC QUPER Simulator | 
            <a href="https://discord.gg/KbjtTFgbbB" target="_blank" style="color: #f39c12;">Discord</a></p>
        </div>
    </div>

    <script>
        // ========== НАСТРОЙКИ SUPABASE (ЗАМЕНИТЕ НА ВАШИ) ==========
        const SUPABASE_URL = "https://vpcxtuwhrpgcgdipgnxx.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwY3h0dXdocnBnY2dkaXBnbnh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDM0MzgsImV4cCI6MjA5MjQxOTQzOH0.-l17k9yaD2Gx6fXEBSoBCVMoyevVVVOjHCxO51qvlTE";
        // =========================================================

        let allConvoys = [];

        async function loadConvoys() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/convoys?select=*&order=id.desc`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });
                
                if (!response.ok) throw new Error('Ошибка загрузки');
                allConvoys = await response.json();
                renderConvoys('all');
            } catch (error) {
                document.getElementById('convoyGrid').innerHTML = `
                    <div class="empty-state">
                        <h3>❌ Ошибка загрузки</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        function getStatusText(status) {
            switch(status) {
                case 'active': return '🟢 Активен';
                case 'upcoming': return '🟡 Запланирован';
                case 'ended': return '⚪ Завершён';
                default: return '🟡 Запланирован';
            }
        }

        function renderConvoys(filter) {
            const grid = document.getElementById('convoyGrid');
            
            let filtered = [...allConvoys];
            
            if (filter !== 'all') {
                if (filter === 'active') {
                    filtered = filtered.filter(c => c.status === 'active');
                } else if (filter === 'upcoming') {
                    filtered = filtered.filter(c => c.status === 'upcoming' || !c.status);
                } else if (filter === 'ended') {
                    filtered = filtered.filter(c => c.status === 'ended');
                } else {
                    filtered = filtered.filter(c => c.game === filter);
                }
            }
            
            const statusOrder = { 'active': 0, 'upcoming': 1, 'ended': 2 };
            filtered.sort((a, b) => (statusOrder[a.status] || 1) - (statusOrder[b.status] || 1));
            
            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-state"><h3>📭 Нет конвоев</h3><p>В выбранной категории пока нет конвоев</p></div>`;
                return;
            }
            
            grid.innerHTML = filtered.map(convoy => {
                const status = convoy.status || 'upcoming';
                const statusText = getStatusText(status);
                
                // ПОКАЗЫВАЕМ для активных И запланированных (если есть trucky_code или cargoman_file)
                const showLinks = (status !== 'ended') && (convoy.trucky_code || convoy.cargoman_file);
                const creationLinks = showLinks ? `
                    <div class="creation-links">
                        <h4>🔧 Создать заказ:</h4>
                        <div class="link-buttons">
                            ${convoy.trucky_code ? `<button class="link-btn trucky" onclick="copyToClipboard('${convoy.trucky_code.replace(/'/g, "\\'")}', 'Trucky код')">🚛 Trucky | ${convoy.trucky_code}</button>` : ''}
                            ${convoy.cargoman_file ? `<button class="link-btn cargoman" onclick="copyToClipboard('${convoy.cargoman_file.replace(/'/g, "\\'")}', 'CargoMan ссылка')">📦 CargoMan | Скопировать ссылку</button>` : ''}
                        </div>
                    </div>
                ` : '';
                
                return `
                    <div class="convoy-card">
                        <div class="card-header ${convoy.game}">
                            <div class="game-badge ${convoy.game}">${convoy.game === 'ATS' ? '🇺🇸 ATS' : '🇪🇺 ETS2'}</div>
                            <h3>${escapeHtml(convoy.from_city)} → ${escapeHtml(convoy.to_city)}</h3>
                            <div class="time-range">
                                📅 ${escapeHtml(convoy.date)} | ⏰ ${escapeHtml(convoy.time_start)} - ${escapeHtml(convoy.time_end)} МСК
                                <span class="status-badge status-${status}">${statusText}</span>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="route">
                                <div class="route-item"><div class="route-icon">📍</div><div class="route-text"><strong>Откуда:</strong> ${escapeHtml(convoy.from_city)} (${escapeHtml(convoy.from_state)}), ${escapeHtml(convoy.from_base)}</div></div>
                                <div class="route-item"><div class="route-icon">🏁</div><div class="route-text"><strong>Куда:</strong> ${escapeHtml(convoy.to_city)} (${escapeHtml(convoy.to_state)}), ${escapeHtml(convoy.to_base)}</div></div>
                            </div>
                            <div class="cargo">
                                <div class="cargo-item"><span class="cargo-label">📦 Груз:</span><span>${escapeHtml(convoy.cargo_name)}</span></div>
                                <div class="cargo-item"><span class="cargo-label">🆔 ID груза:</span><span>${escapeHtml(convoy.cargo_id)}</span></div>
                                <div class="cargo-item"><span class="cargo-label">📏 Дистанция:</span><span>${escapeHtml(convoy.distance)}</span></div>
                            </div>
                            ${creationLinks}
                            ${convoy.notes ? `<div class="info-row" style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #ecf0f1;"><span class="cargo-label">📝 Примечание:</span><span>${escapeHtml(convoy.notes)}</span></div>` : ''}
                        </div>
                        <div class="card-footer">
                            <button class="join-btn" onclick="copyConvoyMessage(${convoy.id})">📋 Скопировать в чат</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Простая защита от XSS
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        async function copyConvoyMessage(id) {
            const convoy = allConvoys.find(c => c.id === id);
            if (!convoy) return;
            
            const status = convoy.status || 'upcoming';
            const statusEmoji = status === 'active' ? '🟢 АКТИВЕН' : (status === 'upcoming' ? '🟡 ПРЕДСТОИТ' : '⚪ ЗАВЕРШЁН');
            
            let message = `🚛 LONG CONVOY в ${convoy.game} ${statusEmoji}\n\n⏰ Взять груз можно с **${convoy.time_start}** до **${convoy.time_end}** (МСК)\n⏰ Сдавать груз не раньше **${convoy.time_end}** (МСК)\n🖥 В оверлее ВТК панели появится надпись "Конвой"\n\n📍 Откуда: ${convoy.from_city} (${convoy.from_state}), ${convoy.from_base}\n📍 Куда: ${convoy.to_city} (${convoy.to_state}), ${convoy.to_base}\n📏 Дистанция: ${convoy.distance}\n📦 Груз: ${convoy.cargo_name} (${convoy.cargo_id})`;
            
            if (convoy.trucky_code) {
                message += `\n\n🚛 Trucky код: ${convoy.trucky_code}`;
            }
            if (convoy.cargoman_file) {
                message += `\n\n📦 CargoMan ссылка: ${convoy.cargoman_file}`;
            }
            
            message += `\n\n👉 Как участвовать:\n- Заходите на сервер и берете мой заказ или создаете через Trucky/Cargoman\n- Можно ехать вместе на сервере или в одиночку\n- В дискорде объясню все детали: https://discord.gg/KbjtTFgbbB\n\n✅ Важно: конвой засчитается всем, кто сдаст груз после **${convoy.time_end}**. Раньше сдавать нельзя, не начислят бонусы.\n\n🔗 Подробнее: ${window.location.href}`;
            
            await navigator.clipboard.writeText(message);
            alert('✅ Информация о конвое скопирована!');
        }

        function copyToClipboard(text, name) {
            navigator.clipboard.writeText(text);
            alert(`✅ ${name} скопирован!`);
        }

        function initFilters() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderConvoys(btn.dataset.filter);
                });
            });
        }

        loadConvoys();
        initFilters();
        setInterval(loadConvoys, 60000);
    </script>
</body>
</html>
